
name: Inspect ERAM Android Project

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q ERAM_GEOMATICS_Android_Studio_v8_Project.zip -d extracted

      - name: Inspect Gradle files
        run: |
          echo "===== PROJECT FILES ====="
          find extracted -type f \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) -print

          echo "===== GRADLE CONFIGURATION ====="
          find extracted -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -print0 | while IFS= read -r -d '' file; do
            echo "===== FILE: $file ====="
            cat "$file"
          done
          
