
name: Build ERAM GEOMATICS APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ERAM_GEOMATICS_Android_Studio_v8_Project.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q ERAM_GEOMATICS_Android_Studio_v8_Project.zip -d extracted

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Align Java and Kotlin targets
        run: |
          cat > extracted/ERAM_GEOMATICS_Android_Studio/align-jvm.gradle <<'EOF'
          allprojects {
            afterEvaluate {
              tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                sourceCompatibility = '17'
                targetCompatibility = '17'
              }
              tasks.matching { it.name.endsWith('Kotlin') }.configureEach {
                kotlinOptions.jvmTarget = '17'
              }
            }
          }
          EOF

      - name: Build APK
        run: |
          cd extracted/ERAM_GEOMATICS_Android_Studio
          gradle -I align-jvm.gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ERAM-GEOMATICS-APK
          path: extracted/ERAM_GEOMATICS_Android_Studio/app/build/outputs/apk/debug/app-debug.apk
          
